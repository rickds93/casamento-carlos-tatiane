<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmar Presença — Carlos &amp; Tatiane</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <section class="invite" style="max-width:640px;">
      <h1 class="amp">Confirmar Presença</h1>
      <p style="font-family: 'Cormorant Garamond', serif; margin-top:8px;">Por favor, confirme sua presença preenchendo o formulário abaixo.</p>

      <form id="rsvp-form" style="margin-top:18px; text-align:left;" autocomplete="on">
        <label style="display:block; margin-bottom:8px; font-weight:600;">Nome completo
          <input type="text" id="rsvp-name" name="name" required style="width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid rgba(0,0,0,0.08);" />
        </label>
        <label style="display:block; margin-bottom:8px; font-weight:600;">E-mail
          <input type="email" id="rsvp-email" name="email" required style="width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid rgba(0,0,0,0.08);" />
        </label>
        <label style="display:block; margin-bottom:8px; font-weight:600;">Número de convidados
          <input type="number" id="rsvp-qty" name="qty" min="0" max="10" value="1" required style="width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid rgba(0,0,0,0.08);" />
        </label>
        <label style="display:block; margin-bottom:8px; font-weight:600;">Mensagem (opcional)
          <textarea id="rsvp-msg" name="message" rows="4" style="width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid rgba(0,0,0,0.08);"></textarea>
        </label>

        <div style="display:flex; gap:10px; margin-top:12px;">
          <button type="submit" class="button" id="rsvp-submit">Enviar confirmação</button>
          <a href="index.html" class="button secondary">Voltar</a>
        </div>

        <p id="rsvp-feedback" style="margin-top:12px; font-size:14px; color:var(--rose-gold); display:none;"></p>
      </form>

      <p style="margin-top:12px; font-size:13px; color:rgba(0,0,0,0.6);">Se preferir, envie direto para <a href="mailto:contato@exemplo.com">contato@exemplo.com</a>.</p>
    </section>
  </main>

  <script>
    // RSVP: send to configured Apps Script endpoint (set config.json in repo root with appsScriptEndpoint)
    async function loadConfig(){
      try{
        const res = await fetch('/config.json');
        if(!res.ok) return null;
        return await res.json();
      }catch(e){ return null; }
    }

    function showMessage(msg, success){
      const el = document.getElementById('rsvp-feedback');
      el.textContent = msg;
      el.style.display = 'block';
      el.style.color = success ? 'var(--rose-gold)' : '#c33';
    }

    document.getElementById('rsvp-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const name = document.getElementById('rsvp-name').value.trim();
      const email = document.getElementById('rsvp-email').value.trim();
      const qty = document.getElementById('rsvp-qty').value;
      const message = document.getElementById('rsvp-msg').value.trim();

      const config = await loadConfig();
      const endpoint = config && config.appsScriptEndpoint ? config.appsScriptEndpoint.trim() : '';

      const payload = { name: name, email: email, qty: qty, message: message };

      const submitButton = document.getElementById('rsvp-submit');
      submitButton.disabled = true;
      submitButton.textContent = 'Enviando...';

      if(endpoint){
        try{
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            mode: 'cors'
          });
          // Try parse JSON response
          let ok = false;
          try{
            const data = await res.json();
            ok = data && data.status === 'success';
          }catch(err){
            ok = res.ok;
          }

          if(ok){
            showMessage('Confirmação enviada. Obrigado!', true);
            document.getElementById('rsvp-form').reset();
          } else {
            showMessage('Falha ao enviar. Tente novamente ou use o e-mail.', false);
          }
        }catch(err){
          console.error(err);
          showMessage('Erro de rede. Tente novamente ou use o e-mail.', false);
        }
      } else {
        // Fallback: open mailto
        const subject = encodeURIComponent('Confirmação de Presença — Carlos & Tatiane');
        const body = encodeURIComponent('Nome: ' + name + '\nE-mail: ' + email + '\nNúmero de convidados: ' + qty + '\nMensagem: ' + message);
        window.location.href = 'mailto:' + (config && config.notifyEmail ? config.notifyEmail : 'contato@exemplo.com') + '?subject=' + subject + '&body=' + body;
      }

      submitButton.disabled = false;
      submitButton.textContent = 'Enviar confirmação';
    });
  </script>
</body>
</html>
