<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lista de Presentes — Carlos &amp; Tatiane</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .gifts-wrap{ max-width:980px; margin:0 auto; padding:20px; }
    /* Fixed header at top */
    header{ position:sticky; top:0; background:var(--white); padding:18px 12px; border-bottom:1px solid rgba(0,0,0,0.04); z-index:50; box-shadow:0 6px 18px rgba(42,42,42,0.04); }
    header .inner{ max-width:980px; margin:0 auto; text-align:center; }
    header h1{ font-family: 'Cormorant Garamond', serif; font-size:28px; margin:6px 0; color:var(--text); }

    /* Make countdown match index layout */
    .countdown{ margin-top:12px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
    .countdown-inner{ display:flex; gap:18px; align-items:center; justify-content:center; }
    .countdown-unit{ display:flex; flex-direction:column; align-items:center; }
    .countdown .number{ font-family:'Cormorant Garamond', serif; font-size:28px; color:var(--text); font-weight:700; }
    .countdown .label{ font-size:12px; color:var(--text); margin-top:4px; }

    /* Sections stacked vertically */
    section.category{ margin-top:28px; display:block; width:100%; }
    section.category + section.category{ margin-top:22px; }
    section.category h2{ font-size:18px; margin-bottom:10px; color:var(--text); }

    table.gifts{ width:100%; border-collapse:collapse; background:var(--white); border-radius:8px; overflow:hidden; box-shadow:0 6px 18px rgba(42,42,42,0.04); }
    table.gifts thead th{ text-align:left; padding:12px 14px; background:linear-gradient(90deg, rgba(199,146,130,0.04), rgba(199,146,130,0.02)); font-weight:700; color:var(--text); }
    table.gifts tbody td{ padding:12px 14px; border-top:1px solid rgba(0,0,0,0.04); color:var(--text); vertical-align:top; }

    @media(max-width:720px){
      header{ padding:14px 10px; }
      header h1{ font-size:22px; }
      .countdown-inner{ gap:10px; }
      .countdown .number{ font-size:16px; }
    }

    @media(max-width:480px){
      header{ padding:10px 8px; }
      header h1{ font-size:18px; margin:4px 0; }
      .countdown-inner{ gap:8px; }
      .countdown .number{ font-size:14px; }
      .gifts-wrap{ padding-top:10px; }
    }

    @media(max-width:720px){ table.gifts thead{ display:none; } table.gifts tbody td{ display:block; padding:10px; } table.gifts tbody tr{ margin-bottom:10px; display:block; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(42,42,42,0.04); } }

    .note{ margin-top:18px; color:var(--text); }
  </style>
</head>
</html>
