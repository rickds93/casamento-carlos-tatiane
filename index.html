<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carlos &amp; Tatiane — 06 Março 2027</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>
  <!-- Particles canvas (background) -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <!-- Petals container -->
  <div id="petals" aria-hidden="true"></div>

  <main class="wrap">
    <section class="invite" id="invite">
      <div class="divider" data-anim="1"></div>

      <h2 class="small" id="name1" data-anim="2">Carlos Alexandre</h2>
      <h1 class="amp" id="amp" data-anim="3">&amp;</h1>
      <h2 class="small" id="name2" data-anim="4">Tatiane</h2>

      <p class="date" id="date" data-anim="5">06 Março 2027</p>

      <blockquote class="quote" id="quote" data-anim="6">“O amor é paciente, o amor é bondoso. Tudo suporta, tudo crê, tudo espera, tudo persevera.”</blockquote>

      <!-- Countdown to event -->
      <div class="countdown" id="countdown" data-anim="7" aria-live="polite" role="timer" aria-atomic="true">
        <div class="countdown-inner">
          <div class="countdown-unit"><span class="number" id="cd-days">0</span><span class="label">dias</span></div>
          <div class="countdown-unit"><span class="number" id="cd-hours">0</span><span class="label">horas</span></div>
          <div class="countdown-unit"><span class="number" id="cd-minutes">0</span><span class="label">min</span></div>
          <div class="countdown-unit"><span class="number" id="cd-seconds">0</span><span class="label">seg</span></div>
        </div>
        <div class="countdown-message" id="cd-message" aria-hidden="true"></div>
      </div>

      <!-- Buttons: Lista de Presentes + Confirmar Presença -->
      <div class="button" data-anim="8">
        <a class="button" id="gift-button" href="lista-de-presentes.html">Lista de Presentes</a>
        <a class="button" id="gift-button" href="confirmar-presenca.html">Confirmar Presença</a>
      </div>

      <div class="divider" data-anim="9"></div>
    </section>
  </main>

  <script src="scripts.js" defer></script>
</body>
</html>
